<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="text-align: center; padding-top: 50px;">
    <div style="background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h1 style="color: #27ae60;">✔ Order Received!</h1>
        <p>Your request for <strong th:text="${orderedItem}">Food Item</strong> has been successfully processed by the Java Spring Boot backend infrastructure.</p>
        <br>
        <a href="/" style="background: #e74c3c; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">Back to Menu</a>
    </div>
</body>
</html>
