<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BiteSprint | Admin Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: #f8fafc; padding: 50px 20px; font-family: Arial, sans-serif;">

    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <h2 style="color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px;">Inventory Management Portal</h2>
        
        <form th:action="@{/admin/add-item}" method="POST">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #4a5568;">Food Cuisine Title:</label>
                <input type="text" name="name" placeholder="e.g., Spicy Peri Peri Wings" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #4a5568;">Price Point ($):</label>
                <input type="number" step="0.01" name="price" placeholder="e.g., 9.99" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #4a5568;">Menu Category Classification:</label>
                <select name="category" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                    <option value="burger">Burgers & Wraps</option>
                    <option value="pizza">Pizzas</option>
                    <option value="dessert">Sweet Desserts</option>
                </select>
            </div>
            
            <button type="submit" style="background: #e74c3c; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;">Publish Item to Menu Grid</button>
        </form>
        
        <a href="/" style="display: block; text-align: center; margin-top: 20px; color: #718096; text-decoration: none; font-size: 0.9rem;">Cancel and Go Back</a>
    </div>

</body>
</html>
